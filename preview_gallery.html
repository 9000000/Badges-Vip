<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elite Badges - Modern Animated GIF Showcase</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #07090e;
      --bg-card: rgba(18, 22, 34, 0.85);
      --border-color: rgba(255, 255, 255, 0.08);
      --accent: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-main);
      background-image: 
        radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.12) 0px, transparent 50%),
        radial-gradient(at 50% 50%, rgba(234, 179, 8, 0.05) 0px, transparent 50%);
      color: var(--text-main);
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      padding: 40px 24px;
      line-height: 1.5;
    }

    header {
      max-width: 1300px;
      margin: 0 auto 40px auto;
      text-align: center;
    }

    .badge-hero {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 9999px;
      color: var(--accent);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 42px;
      font-weight: 900;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 50%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-fill-color: transparent;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 18px;
      max-width: 680px;
      margin: 0 auto;
    }

    .stats-bar {
      display: flex;
      justify-content: center;
      gap: 32px;
      margin-top: 24px;
      flex-wrap: wrap;
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stat-val {
      font-size: 24px;
      font-weight: 800;
      color: #38bdf8;
    }

    .stat-lbl {
      font-size: 12px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Filter Controls */
    .controls {
      max-width: 1300px;
      margin: 0 auto 32px auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-color);
    }

    .filter-tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tab-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
    }

    .tab-btn.active {
      background: rgba(56, 189, 248, 0.15);
      border-color: #38bdf8;
      color: #38bdf8;
    }

    .bg-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .toggle-btn {
      padding: 6px 12px;
      border-radius: 6px;
      background: #1e293b;
      border: 1px solid var(--border-color);
      color: #fff;
      cursor: pointer;
      font-size: 12px;
    }

    /* Gallery Grid */
    .gallery-container {
      max-width: 1300px;
      margin: 0 auto;
    }

    .group-section {
      margin-bottom: 48px;
    }

    .group-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .group-title {
      font-size: 20px;
      font-weight: 800;
      color: #f1f5f9;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .group-badge-count {
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      font-size: 12px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 9999px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 24px;
    }

    .badge-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 20px;
      backdrop-filter: blur(12px);
      transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .badge-card:hover {
      transform: translateY(-4px);
      border-color: rgba(56, 189, 248, 0.4);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4), 0 0 20px rgba(56, 189, 248, 0.1);
    }

    .badge-info {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .badge-name {
      font-size: 16px;
      font-weight: 700;
      color: #f8fafc;
    }

    .badge-id {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #64748b;
      background: rgba(0, 0, 0, 0.3);
      padding: 2px 6px;
      border-radius: 4px;
    }

    .image-wrapper {
      width: 100%;
      height: 140px;
      background: #000000;
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .image-wrapper.light-bg {
      background: #ffffff !important;
    }

    .image-wrapper.checker-bg {
      background: repeating-conic-gradient(#1e293b 0% 25%, #0f172a 0% 50%) 50% / 16px 16px !important;
    }

    .image-wrapper img {
      max-width: 90%;
      max-height: 110px;
      object-fit: contain;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.5));
    }

    .badge-footer {
      width: 100%;
      margin-top: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: #64748b;
    }

    .file-name {
      font-family: 'JetBrains Mono', monospace;
      color: #94a3b8;
    }

    .file-status {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: #10b981;
      font-weight: 600;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 6px #10b981;
    }
  </style>
</head>
<body>

  <header>
    <div class="badge-hero">
      <span>✨ Elite Badges 2.0</span>
    </div>
    <h1>Modern Animated Badges</h1>
    <p class="subtitle">Complete set of 31 high-performance animated GIF media badges with custom looping visual effects, glassmorphism containers, and vibrant HDR/lossless audio dynamics.</p>
    
    <div class="stats-bar">
      <div class="stat-item">
        <span class="stat-val">31</span>
        <span class="stat-lbl">Total Badges</span>
      </div>
      <div class="stat-item">
        <span class="stat-val">7</span>
        <span class="stat-lbl">Categories</span>
      </div>
      <div class="stat-item">
        <span class="stat-val">24 FPS</span>
        <span class="stat-lbl">Smooth Loop</span>
      </div>
      <div class="stat-item">
        <span class="stat-val">100%</span>
        <span class="stat-lbl">GIF Conversion</span>
      </div>
    </div>
  </header>

  <div class="controls">
    <div class="filter-tabs">
      <button class="tab-btn active" onclick="filterGroup('all', this)">All Badges (31)</button>
      <button class="tab-btn" onclick="filterGroup('source', this)">Source (6)</button>
      <button class="tab-btn" onclick="filterGroup('resolution', this)">Resolution (4)</button>
      <button class="tab-btn" onclick="filterGroup('video-tech', this)">Video Tech (7)</button>
      <button class="tab-btn" onclick="filterGroup('video-codec', this)">Video Codec (2)</button>
      <button class="tab-btn" onclick="filterGroup('bit-depth', this)">Bit Depth (2)</button>
      <button class="tab-btn" onclick="filterGroup('audio-tech', this)">Audio Tech (8)</button>
      <button class="tab-btn" onclick="filterGroup('audio-channels', this)">Audio Channels (2)</button>
    </div>

    <div class="bg-toggle">
      <span>Background:</span>
      <button class="toggle-btn" onclick="setBg('dark')">Dark</button>
      <button class="toggle-btn" onclick="setBg('checker')">Checker</button>
      <button class="toggle-btn" onclick="setBg('light')">Light</button>
    </div>
  </div>

  <div class="gallery-container" id="gallery">
    <!-- Populated by JavaScript -->
  </div>

  <script>
    const BADGES = [
      // Source
      { id: "remux", name: "REMUX", group: "source", groupName: "Source", file: "remux.gif" },
      { id: "blu-ray-disc", name: "Blu-ray Disc", group: "source", groupName: "Source", file: "blu_ray_disc.gif" },
      { id: "webdl", name: "WEB-DL", group: "source", groupName: "Source", file: "WEBDL_transparent_4x.gif" },
      { id: "webrip", name: "WEBRip", group: "source", groupName: "Source", file: "WEBRip_transparent_4x.gif" },
      { id: "hdtv", name: "HDTV", group: "source", groupName: "Source", file: "HDTV_transparent_4x.gif" },
      { id: "dvd-rip", name: "DVD RIP", group: "source", groupName: "Source", file: "DVD_RIP_transparent_4x.gif" },

      // Resolution
      { id: "4k-ultra-hd", name: "4K Ultra HD", group: "resolution", groupName: "Resolution", file: "4k_ultra_hd.gif" },
      { id: "1080p-full-hd", name: "1080p Full HD", group: "resolution", groupName: "Resolution", file: "1080p_full_hd.gif" },
      { id: "720p-hd", name: "720p HD", group: "resolution", groupName: "Resolution", file: "720p_hd.gif" },
      { id: "480p-sd", name: "480p SD", group: "resolution", groupName: "Resolution", file: "480p_sd.gif" },

      // Video Tech
      { id: "dolby-vision", name: "Dolby Vision", group: "video-tech", groupName: "Video Tech", file: "dolby_vision.gif" },
      { id: "hdr10-plus", name: "HDR10+", group: "video-tech", groupName: "Video Tech", file: "hdr10_plus.gif" },
      { id: "hdr10", name: "HDR10", group: "video-tech", groupName: "Video Tech", file: "hdr10.gif" },
      { id: "hdr", name: "HDR", group: "video-tech", groupName: "Video Tech", file: "hdr.gif" },
      { id: "sdr", name: "SDR", group: "video-tech", groupName: "Video Tech", file: "SDR_transparent_4x.gif" },
      { id: "imax-enhanced", name: "IMAX Enhanced", group: "video-tech", groupName: "Video Tech", file: "imax_enhanced.gif" },
      { id: "imax", name: "IMAX", group: "video-tech", groupName: "Video Tech", file: "imax.gif" },

      // Video Codec
      { id: "hevc", name: "HEVC", group: "video-codec", groupName: "Video Codec", file: "HEVC_transparent_4x.gif" },
      { id: "avc", name: "AVC", group: "video-codec", groupName: "Video Codec", file: "AVC_transparent_4x.gif" },

      // Bit Depth
      { id: "10bit", name: "10Bit", group: "bit-depth", groupName: "Bit Depth", file: "10Bit_transparent_4x.gif" },
      { id: "8bit", name: "8Bit", group: "bit-depth", groupName: "Bit Depth", file: "8Bit_transparent_4x.gif" },

      // Audio Tech
      { id: "dolby-atmos", name: "Dolby Atmos", group: "audio-tech", groupName: "Audio Tech", file: "dolby_atmos.gif" },
      { id: "truehd", name: "TrueHD", group: "audio-tech", groupName: "Audio Tech", file: "truehd.gif" },
      { id: "dolby-digital-plus", name: "Dolby Digital Plus", group: "audio-tech", groupName: "Audio Tech", file: "dolby_digital_plus.gif" },
      { id: "dolby-digital", name: "Dolby Digital", group: "audio-tech", groupName: "Audio Tech", file: "dolby_digital.gif" },
      { id: "dts-x", name: "DTS:X", group: "audio-tech", groupName: "Audio Tech", file: "dts_x.gif" },
      { id: "dts-hd-master-audio", name: "DTS-HD Master Audio", group: "audio-tech", groupName: "Audio Tech", file: "dts_hd_master_audio.gif" },
      { id: "dts-hd", name: "DTS-HD", group: "audio-tech", groupName: "Audio Tech", file: "dts_hd.gif" },
      { id: "dts", name: "DTS", group: "audio-tech", groupName: "Audio Tech", file: "dts.gif" },

      // Audio Channels
      { id: "71-audio", name: "7.1 Audio", group: "audio-channels", groupName: "Audio Channels", file: "7_1_audio.gif" },
      { id: "51-audio", name: "5.1 Audio", group: "audio-channels", groupName: "Audio Channels", file: "5_1_audio.gif" }
    ];

    let currentFilter = 'all';
    let currentBg = 'dark';

    function render() {
      const container = document.getElementById('gallery');
      container.innerHTML = '';

      const groups = {};
      BADGES.forEach(b => {
        if (currentFilter !== 'all' && b.group !== currentFilter) return;
        if (!groups[b.group]) {
          groups[b.group] = { name: b.groupName, items: [] };
        }
        groups[b.group].items.push(b);
      });

      for (const [gid, g] of Object.entries(groups)) {
        const section = document.createElement('div');
        section.className = 'group-section';
        section.innerHTML = `
          <div class="group-header">
            <h2 class="group-title">${g.name}</h2>
            <span class="group-badge-count">${g.items.length}</span>
          </div>
          <div class="grid" id="grid-${gid}"></div>
        `;
        container.appendChild(section);

        const grid = section.querySelector(`#grid-${gid}`);
        g.items.forEach(b => {
          const card = document.createElement('div');
          card.className = 'badge-card';
          card.innerHTML = `
            <div class="badge-info">
              <span class="badge-name">${b.name}</span>
              <span class="badge-id">${b.id}</span>
            </div>
            <div class="image-wrapper ${currentBg}-bg">
              <img src="Badges/${b.file}" alt="${b.name}">
            </div>
            <div class="badge-footer">
              <span class="file-name">${b.file}</span>
              <span class="file-status"><span class="status-dot"></span> 24 FPS GIF</span>
            </div>
          `;
          grid.appendChild(card);
        });
      }
    }

    function filterGroup(group, btn) {
      currentFilter = group;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    }

    function setBg(bg) {
      currentBg = bg;
      document.querySelectorAll('.image-wrapper').forEach(w => {
        w.className = `image-wrapper ${bg}-bg`;
      });
    }

    render();
  </script>
</body>
</html>
